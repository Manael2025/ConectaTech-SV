<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Iniciar sesión | ConectaTech SV</title>
  <link rel="stylesheet" href="/css/estilos.css">
</head>
<body>
  <header id="header"></header>

  <main class="contenedor">
    <form class="formulario" id="form-login" novalidate>
      <h1>Iniciar sesión</h1>
      <div id="mensaje"></div>

      <div class="campo">
        <label for="correo">Correo electrónico</label>
        <input type="email" id="correo" name="correo" autocomplete="email" required>
      </div>
      <div class="campo">
        <label for="contrasena">Contraseña</label>
        <input type="password" id="contrasena" name="contrasena" autocomplete="current-password" required>
      </div>

      <button type="submit" class="btn btn-prin" style="width:100%">Entrar</button>
      <p class="formulario-pie">¿No tienes cuenta? <a href="/registro.html" id="enlace-registro">Regístrate</a></p>
    </form>
  </main>

  <footer id="footer"></footer>

  <script src="/js/main.js"></script>
  <script src="/js/auth.js"></script>
</body>
</html>
