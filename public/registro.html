<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Crear cuenta | ConectaTech SV</title>
  <link rel="stylesheet" href="/css/estilos.css">
</head>
<body>
  <header id="header"></header>

  <main class="contenedor">
    <form class="formulario" id="form-registro" novalidate>
      <h1>Crear cuenta</h1>
      <div id="mensaje"></div>

      <div class="campo">
        <label for="nombre">Nombre completo</label>
        <input type="text" id="nombre" name="nombre" autocomplete="name" maxlength="80" required>
      </div>
      <div class="campo">
        <label for="correo">Correo electrónico</label>
        <input type="email" id="correo" name="correo" autocomplete="email" required>
      </div>
      <div class="campo">
        <label for="telefono">Teléfono (opcional)</label>
        <input type="tel" id="telefono" name="telefono" autocomplete="tel" placeholder="7000-0000">
      </div>
      <div class="campo">
        <label for="contrasena">Contraseña (mínimo 8 caracteres)</label>
        <input type="password" id="contrasena" name="contrasena" autocomplete="new-password" required>
      </div>
      <div class="campo">
        <label for="confirmar">Confirmar contraseña</label>
        <input type="password" id="confirmar" name="confirmar" autocomplete="new-password" required>
      </div>

      <button type="submit" class="btn btn-prin" style="width:100%">Crear cuenta</button>
      <p class="formulario-pie">¿Ya tienes cuenta? <a href="/login.html">Inicia sesión</a></p>
    </form>
  </main>

  <footer id="footer"></footer>

  <script src="/js/main.js"></script>
  <script src="/js/auth.js"></script>
</body>
</html>
